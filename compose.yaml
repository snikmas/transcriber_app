services:
  api:
    build: .
    environment:
      TRANSCRIBER_MODE: ${TRANSCRIBER_MODE:-local}
      WHISPER_MODEL: ${WHISPER_MODEL:-tiny}
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_OFFLINE: ${WHISPER_OFFLINE:-false}
      DATABASE_PATH: /app/data/jobs.sqlite3
      UPLOAD_DIR: /app/data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      ANALYSIS_MODE: ${ANALYSIS_MODE:-live}
      ANALYSIS_PROVIDER: ${ANALYSIS_PROVIDER:-deepseek}
      ANALYSIS_PROTOCOL: ${ANALYSIS_PROTOCOL:-openai_chat}
      ANALYSIS_MODEL: ${ANALYSIS_MODEL:-deepseek-v4-flash}
      ANALYSIS_BASE_URL: ${ANALYSIS_BASE_URL:-}
      ANALYSIS_OUTPUT_LANGUAGE: ${ANALYSIS_OUTPUT_LANGUAGE:-auto}
      ANALYSIS_TIMEOUT_SECONDS: ${ANALYSIS_TIMEOUT_SECONDS:-60}
      ANALYSIS_MAX_ATTEMPTS: ${ANALYSIS_MAX_ATTEMPTS:-3}
      ANALYSIS_CHUNK_CHARS: ${ANALYSIS_CHUNK_CHARS:-12000}
      ANALYSIS_MAX_CHUNKS: ${ANALYSIS_MAX_CHUNKS:-10}
      ANALYSIS_MAX_TRANSCRIPT_CHARS: ${ANALYSIS_MAX_TRANSCRIPT_CHARS:-120000}
      CUSTOM_PROVIDER_POLICY: ${CUSTOM_PROVIDER_POLICY:-local-only}
      ALLOW_LOCAL_PROVIDER_URLS: ${ALLOW_LOCAL_PROVIDER_URLS:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANALYSIS_API_KEY: ${ANALYSIS_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - transcriber-data:/app/data
      - whisper-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_URL: http://api:8000
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-0.5}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  transcriber-data:
  whisper-cache:
