[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "private-local-transcriber"
version = "1.0.0"
description = "Portfolio-ready private audio and video transcription service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx[socks]>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "requests>=2.32,<3",
  "streamlit>=1.47,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
local = [
  "faster-whisper>=1.2,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF", "UP"]
